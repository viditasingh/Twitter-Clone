{% extends "layout.html" %} {% block title %}Vidita aur Tweet {% endblock %}
{%block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-lg border-0 p-4 text-center">
      <h2 class="mb-4">Are you sure you want to delete this tweet?</h2>
      <form method="post" class="mb-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger btn-lg me-2">YES</button>
        <a href="{% url 'tweet_list' %}" class="btn btn-success btn-lg">NO</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
